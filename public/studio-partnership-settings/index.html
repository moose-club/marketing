  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

UI, dense content, documents */\n  --cream-50: #fbf9f6;   /* barely-there warmth — prefer over reverting to white */\n  --cream:    #f7f4ef;   /* the warm canvas — brand, marketing, covers; use with confidence */\n  --cream-deep:#efe9e0;  /* cream borders / wells */\n  --gray-50:  #f7f8fa;\n  --gray-100: #eef0f4;\n  --gray-200: #e1e4ec;\n  --gray-300: #cbd0db;\n  --gray-400: #9aa1b2;\n  --gray-500: #6b7385;\n  --gray-600: #4c5365;\n  --gray-700: #353b4a;\n  --gray-800: #232734;\n  --gray-900: #14161d;\n\n  /* ---------- SEMANTIC (status) — product UI ONLY, never brand/marketing --- */\n  --success:  #2f9e6b;\n  --success-bg:#e7f4ee;\n  --warning:  #d98a23;\n  --warning-bg:#fbf0dd;\n  --danger:   #d6453f;\n  --danger-bg:#fbe7e6;\n  --info:     var(--navy-600);\n  --info-bg:  var(--navy-50);\n\n  /* ---------- SURFACE / TEXT ROLES -----------------------------------------\n     v2 surface rules: cream is the warm canvas (brand, marketing, covers);\n     cream-50 is the quieter warmth; white is the workhorse for product UI &\n     documents; navy is the statement. White cards on a cream ground is a\n     signature move. Typical page mix: cream ~48% · white ~30% · navy · pink last few %. */\n  --bg:           var(--white);\n  --bg-alt:       var(--cream);\n  --bg-inverse:   var(--moose-navy);\n  --surface:      var(--white);\n  --surface-sunken: var(--gray-50);\n\n  --fg:           var(--moose-navy);   /* primary text on light                */\n  --fg-muted:     var(--gray-500);     /* secondary text                       */\n  --fg-subtle:    var(--gray-400);     /* tertiary / meta                      */\n  --fg-on-dark:   #ffffff;             /* text on navy                         */\n  --fg-on-dark-muted: rgba(255,255,255,.66);\n\n  /* Pink is the signature, never the flood: ~5–10% of a layout, small surfaces\n     only. Primary buttons are NAVY at every size; pink fills are compact\n     accents — one per view — or the pink-outline button. Links may be pink.\n --------------------------------------------- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 16px;\n  --radius-lg: 22px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---------- SHADOWS / ELEVATION ------------------------------------------ */\n  --shadow-xs: 0 1px 2px rgba(16,26,60,.06);\n  --shadow-sm: 0 2px 8px rgba(16,26,60,.08);\n  --shadow-md: 0 8px 24px rgba(16,26,60,.10);\n  --shadow-lg: 0 18px 48px rgba(16,26,60,.14);\n  --shadow-pink: 0 10px 28px rgba(235,78,141,.32);\n\n  /* ---------- SPACING (4px base) ------------------------------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ---------- MOTION -------------------------------------------------------- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 380ms; /* @kind other */\n\n  /* ---------- COLOUR WASHES (v2) — hero / cover / divider moments ONLY ------\n     One wash colour per layout (navy OR pink, never both at full).\n     Over photography: ramp darker toward the type. Never wash UI screenshots,\n     product shots or the logo sheet. ≤ 22% opacity on light fields. */\n  --wash-photo-light:  linear-gradient(180deg, rgba(26,43,95,.22), rgba(26,43,95,.42) 55%, rgba(26,43,95,.80)); /* @kind other */\n  --wash-photo-medium: linear-gradient(180deg, rgba(26,43,95,.46), rgba(26,43,95,.78)); /* @kind other */\n  --wash-photo-bold:   linear-gradient(180deg, rgba(26,43,95,.66), rgba(26,43,95,.92)); /* @kind other */\n  --wash-scrim:        linear-gradient(180deg, transparent 40%, rgba(26,43,95,.78)); /* @kind other */\n  --wash-cream-pink:   radial-gradient(ellipse at top right, rgba(235,78,141,.22), transparent 60%); /* @kind other */\n  --wash-cream-navy:   radial-gradient(ellipse at bottom left, rgba(26,43,95,.16), transparent 60%); /* @kind other */\n  --wash-navy-pink:    linear-gradient(135deg, transparent 28%, rgba(235,78,141,.44)); /* @kind other */\n  --wash-pink-deep:    linear-gradient(160deg, transparent 18%, rgba(122,23,66,.58)); /* @kind other */\n}\n\n/* ============================================================================\n   SEMANTIC TYPE CLASSES\n   Trailing-period display headings (\"The Moose model.\") are a brand signature —\n   apply the period in content, not CSS.\n   ============================================================================ */\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-eyebrow);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n  line-height: 1;\n}\n\n.display, .h-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-5xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh3, .h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n}\n\nh4, .h4 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-md);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n}\n\np, .body {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n\n.lead {\n  font-size: var(--text-md);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n\n.label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-sm);\n  color: var(--fg);\n}\n\n.meta {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--text-xs);\n  color: var(--fg-subtle);\n}\n\n.stat {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-3xl);\n  letter-spacing: var(--tracking-tight);\n  line-height: 1;\n  color: var(--accent);\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   MOOSE CLUB — Colors & Type Foundations\n   ----------------------------------------------------------------------------\n   Brand: Moose Club (FLEX Network). A B2B platform that lets boutique fitness\n   studios form reciprocal partnerships and sell a premium \"crossover\" upgrade.\n\n   Typeface: Poppins (ExtraBold / Bold / SemiBold / Regular) — the exact family\n   used in the source deck. Loaded from Google Fonts (no substitution needed).\n   The \"moose\" wordmark itself is a custom logotype shipped as an asset.\n\n   Import this file, then use the design tokens. Pair with the Google Fonts tag:\n   <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n   ============================================================================ */\n\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"aaa15855-7648-466f-8480-65c665f83fa1\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* e: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"7333eeeb-b1f4-46fa-bc69-40a34af34f62\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"23a0d115-f8af-4718-bf55-e3a4a4985e16\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"47c53bd1-0293-4fda-bf75-42c787c7449f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- BRAND CORE ---------------------------------------------------- */\n  --moose-navy:        #1A2B5F;   /* primary — wordmark, headings, dark fills   */\n  --moose-pink:        #EB4E8D;   /* accent — the infinity loop, CTAs, highlights */\n\n  /* ---------- NAVY SCALE ---------------------------------------------------- */\n  --navy-950: #0C1430;\n  --navy-900: #0F1A3C;\n  --navy-800: #14224C;\n  --navy-700: #1A2B5F;   /* = --moose-navy */\n  --navy-600: #243a78;\n  --navy-500: #324a8c;\n  --navy-400: #5567a4;\n  --navy-300: #8b97bf;\n  --navy-200: #c2c9dd;\n  --navy-100: #e6e9f2;\n  --navy-50:  #f3f5fa;\n\n  /* ---------- PINK SCALE ---------------------------------------------------- */\n  --pink-700: #c5316f;\n  --pink-600: #d63b79;\n  --pink-500: #EB4E8D;   /* = --moose-pink */\n  --pink-400: #f06ba1;\n  --pink-300: #f59bc0;\n  --pink-200: #fac7dc;\n  --pink-100: #fde4ee;\n  --pink-50:  #fef2f7;\n\n  /* ---------- NEUTRALS ------------------------------------------------------ */\n  --white:    #ffffff;   /* the workhorse — product UI, dense content, documents */\n  --cream-50: #fbf9f6;   /* barely-there warmth — prefer over reverting to white */\n  --cream:    #f7f4ef;   /* the warm canvas — brand, marketing, covers; use with confidence */\n  --cream-deep:#efe9e0;  /* cream borders / wells */\n  --gray-50:  #f7f8fa;\n  --gray-100: #eef0f4;\n  --gray-200: #e1e4ec;\n  --gray-300: #cbd0db;\n  --gray-400: #9aa1b2;\n  --gray-500: #6b7385;\n  --gray-600: #4c5365;\n  --gray-700: #353b4a;\n  --gray-800: #232734;\n  --gray-900: #14161d;\n\n  /* ---------- SEMANTIC (status) — product UI ONLY, never brand/marketing --- */\n  --success:  #2f9e6b;\n  --success-bg:#e7f4ee;\n  --warning:  #d98a23;\n  --warning-bg:#fbf0dd;\n  --danger:   #d6453f;\n  --danger-bg:#fbe7e6;\n  --info:     var(--navy-600);\n  --info-bg:  var(--navy-50);\n\n  /* ---------- SURFACE / TEXT ROLES -----------------------------------------\n     v2 surface rules: cream is the warm canvas (brand, marketing, covers);\n     cream-50 is the quieter warmth; white is the workhorse for product UI &\n     documents; navy is the statement. White cards on a cream ground is a\n     signature move. Typical page mix: cream ~48% · white ~30% · navy · pink last few %. */\n  --bg:           var(--white);\n  --bg-alt:       var(--cream);\n  --bg-inverse:   var(--moose-navy);\n  --surface:      var(--white);\n  --surface-sunken: var(--gray-50);\n\n  --fg:           var(--moose-navy);   /* primary text on light                */\n  --fg-muted:     var(--gray-500);     /* secondary text                       */\n  --fg-subtle:    var(--gray-400);     /* tertiary / meta                      */\n  --fg-on-dark:   #ffffff;             /* text on navy                         */\n  --fg-on-dark-muted: rgba(255,255,255,.66);\n\n  /* Pink is the signature, never the flood: ~5–10% of a layout, small surfaces\n     only. Primary buttons are NAVY at every size; pink fills are compact\n     accents — one per view — or the pink-outline button. Links may be pink.\n     On navy surfaces, buttons are white or cream — never pink fills. */\n  --accent:       var(--moose-pink);\n  --accent-fg:    #ffffff;             /* text on pink                         */\n  --action:       var(--moose-navy);   /* primary button fill — navy leads     */\n  --action-hover: var(--navy-800);     /* hover darkens one ramp step          */\n  --accent-hover: var(--pink-600);     /* pink hover step                      */\n  --border:       var(--gray-200);\n  --border-strong:var(--gray-300);\n  --border-on-dark: rgba(255,255,255,.16);\n\n  /* ---------- TYPE: FAMILY -------------------------------------------------- */\n  --font-sans: 'Poppins', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-display: 'Poppins', ui-sans-serif, system-ui, sans-serif;\n\n  /* ---------- TYPE: WEIGHTS ------------------------------------------------- */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */\n\n  /* ---------- TYPE: SCALE (rem; 1rem = 16px) ------------------------------- */\n  --text-eyebrow: 0.75rem;   /* 12px — tracked uppercase labels                */\n  --text-xs:   0.75rem;      /* 12 */\n  --text-sm:   0.875rem;     /* 14 */\n  --text-base: 1rem;         /* 16 */\n  --text-md:   1.125rem;     /* 18 */\n  --text-lg:   1.375rem;     /* 22 */\n  --text-xl:   1.75rem;      /* 28 */\n  --text-2xl:  2.25rem;      /* 36 */\n  --text-3xl:  3rem;         /* 48 */\n  --text-4xl:  3.75rem;      /* 60 */\n  --text-5xl:  4.75rem;      /* 76 — hero display                              */\n\n  --leading-tight: 1.05;\n  --leading-snug:  1.18;\n  --leading-normal:1.5;\n  --leading-relaxed:1.65;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-eyebrow:0.22em;   /* the wide-tracked uppercase eyebrow look      */\n\n  /* ---------- RADII --------------------------------------------------------- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 16px;\n  --radius-lg: 22px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---------- SHADOWS / ELEVATION ------------------------------------------ */\n  --shadow-xs: 0 1px 2px rgba(16,26,60,.06);\n  --shadow-sm: 0 2px 8px rgba(16,26,60,.08);\n  --shadow-md: 0 8px 24px rgba(16,26,60,.10);\n  --shadow-lg: 0 18px 48px rgba(16,26,60,.14);\n  --shadow-pink: 0 10px 28px rgba(235,78,141,.32);\n\n  /* ---------- SPACING (4px base) ------------------------------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ---------- MOTION -------------------------------------------------------- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 380ms; /* @kind other */\n\n  /* ---------- COLOUR WASHES (v2) — hero / cover / divider moments ONLY ------\n     One wash colour per layout (navy OR pink, never both at full).\n     Over photography: ramp darker toward the type. Never wash UI screenshots,\n     product shots or the logo sheet. ≤ 22% opacity on light fields. */\n  --wash-photo-light:  linear-gradient(180deg, rgba(26,43,95,.22), rgba(26,43,95,.42) 55%, rgba(26,43,95,.80)); /* @kind other */\n  --wash-photo-medium: linear-gradient(180deg, rgba(26,43,95,.46), rgba(26,43,95,.78)); /* @kind other */\n  --wash-photo-bold:   linear-gradient(180deg, rgba(26,43,95,.66), rgba(26,43,95,.92)); /* @kind other */\n  --wash-scrim:        linear-gradient(180deg, transparent 40%, rgba(26,43,95,.78)); /* @kind other */\n  --wash-cream-pink:   radial-gradient(ellipse at top right, rgba(235,78,141,.22), transparent 60%); /* @kind other */\n  --wash-cream-navy:   radial-gradient(ellipse at bottom left, rgba(26,43,95,.16), transparent 60%); /* @kind other */\n  --wash-navy-pink:    linear-gradient(135deg, transparent 28%, rgba(235,78,141,.44)); /* @kind other */\n  --wash-pink-deep:    linear-gradient(160deg, transparent 18%, rgba(122,23,66,.58)); /* @kind other */\n}\n\n/* ============================================================================\n   SEMANTIC TYPE CLASSES\n   Trailing-period display headings (\"The Moose model.\") are a brand signature —\n   apply the period in content, not CSS.\n   ============================================================================ */\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-eyebrow);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n  line-height: 1;\n}\n\n.display, .h-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-5xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n\nh3, .h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n}\n\nh4, .h4 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-md);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n}\n\np, .body {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n\n.lead {\n  font-size: var(--text-md);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n\n.label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-sm);\n  color: var(--fg);\n}\n\n.meta {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--text-xs);\n  color: var(--fg-subtle);\n}\n\n.stat {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extrabold);\n  font-size: var(--text-3xl);\n  letter-spacing: var(--tracking-tight);\n  line-height: 1;\n  color: var(--accent);\n}\n<\u002Fstyle>\n  <script src=\"a8de7357-17b7-40fa-9ef1-45381220e783\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; background: #f7f4ef; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: #1A2B5F; }\n    a { color: #EB4E8D; } a:hover { color: #d63b79; }\n    input, select, button { font-family: inherit; }\n    input[type=number]::-webkit-inner-spin-button { opacity: .4; }\n    input:focus, select:focus, button:focus-visible { outline: none; box-shadow: 0 0 0 3px #fde4ee; }\n    input::placeholder { color: #9aa1b2; font-weight: 500; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-direction: column; gap: 24px;\">\n\n  <div style=\"padding-bottom: 8px;\"><img src=\"b69e4691-6626-42cf-9446-d110824fbba4\" alt=\"moose\" style=\"height: 34px; width: auto; display: block;\"><\u002Fdiv>\n\n  <header style=\"display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid #e1e4ec;\">\n    <h1 style=\"margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; color: #1A2B5F;\">Your partnership settings and fee calculation<\u002Fh1>\n    <div style=\"font-size: 14px; line-height: 1.6; color: #6b7385;\">Not sure what to charge? Start with <a href=\"/studio-upgrade-fee\" style=\"color: #c5316f; font-weight: 600; text-decoration: underline; text-underline-offset: 3px;\">Determining your upgrade fee<\u002Fa>.<\u002Fdiv>\n  <\u002Fheader>\n\n\n  <!-- PART 2 -->\n  <section style=\"display: flex; flex-direction: column; gap: 20px; padding-top: 16px;\">\n    <div style=\"display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; padding: 20px 28px; background: #1A2B5F; border-radius: 16px;\"><h2 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; color: #fff;\">Levers to balance partnerships<\u002Fh2><\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #e1e4ec; border-radius: 24px; padding: 32px 36px; display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr); gap: 28px 48px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; color: #1A2B5F;\">The balancing levers<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid #e1e4ec; border-radius: 999px; width: fit-content; font-size: 12.5px; font-weight: 600; color: #1A2B5F;\"><span style=\"width: 20px; height: 20px; border-radius: 999px; background: #f3f5fa; color: #EB4E8D; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;\">1<\u002Fspan>Permitted imbalance<\u002Fdiv>\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid #e1e4ec; border-radius: 999px; width: fit-content; font-size: 12.5px; font-weight: 600; color: #1A2B5F;\"><span style=\"width: 20px; height: 20px; border-radius: 999px; background: #f3f5fa; color: #EB4E8D; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;\">2<\u002Fspan>Rebalancing payment<\u002Fdiv>\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid #e1e4ec; border-radius: 999px; width: fit-content; font-size: 12.5px; font-weight: 600; color: #1A2B5F;\"><span style=\"width: 20px; height: 20px; border-radius: 999px; background: #f3f5fa; color: #EB4E8D; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;\">3<\u002Fspan>Session restrictions<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.6; color: #6b7385;\">\n        <div>Reciprocity is a core tenet of Moose: partnerships only work when value flows both ways, evenly and fairly.<\u002Fdiv>\n        <div>Member flow will seldom be perfectly even, so Moose gives partner studios three levers to manage their exchange. They apply in a cascade: permitted imbalance<span style=\"display: inline-block; margin: 0 7px; color: #1A2B5F; font-size: 15px; line-height: 1; vertical-align: -1px;\">→<\u002Fspan>rebalancing payment<span style=\"display: inline-block; margin: 0 7px; color: #1A2B5F; font-size: 15px; line-height: 1; vertical-align: -1px;\">→<\u002Fspan>session restrictions.<\u002Fdiv>\n        <div style=\"font-size: 15px; font-weight: 600; line-height: 1.5; color: #1A2B5F;\">These levers are set and managed by you, so it's worth taking a moment to understand their application.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #e1e4ec; border-radius: 24px; padding: 32px 36px; display: flex; flex-direction: column;\">\n      <div style=\"display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 16px 40px; align-items: center; padding: 0 0 26px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #EB4E8D;\">Lever 01<\u002Fdiv>\n        <div style=\"font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; color: #1A2B5F;\">Permitted imbalance buffer<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.55; color: #6b7385;\">\n          <div><span style=\"color: #9aa1b2;\">Applies<\u002Fspan> first<\u002Fdiv>\n          <div style=\"font-style: italic; color: #9aa1b2;\">Bilaterally set between the partners<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">The partners agree a buffer within which each studio is happy to host a disproportionate share of visits from the other.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">The buffer works both ways. At 10%, if your partner hosts 100 visits from your members, you accept hosting up to 110 of theirs without penalty — and they accept the same in reverse. This is before any relative weighting is applied to visits.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">Visits are weighted for the relative pricing of the two studios. If a member’s home studio is more expensive than the destination studio, a visit is weighted to use less than one credit (and vice versa). Each studio’s pricing is set by its standardised weekly pricing reference (SWPR — see below).<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; height: 1px; background: #eef0f4; display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 0 40px;\"><span style=\"position: relative; justify-self: start; margin-left: 0; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 999px; background: #fff; border: 1px solid #e1e4ec; display: inline-flex; align-items: center; justify-content: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EB4E8D\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"m19 12-7 7-7-7\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 16px 40px; align-items: center; padding: 30px 0;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #EB4E8D;\">Lever 02<\u002Fdiv>\n        <div style=\"font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; color: #1A2B5F;\">Rebalancing payment<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.55; color: #6b7385;\">\n          <div><span style=\"color: #9aa1b2;\">Applies<\u002Fspan> once the buffer is exhausted<\u002Fdiv>\n          <div style=\"font-style: italic; color: #9aa1b2;\">Bilaterally set between the partners<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">For any imbalance beyond the accepted buffer, a rebalancing payment is made to the studio hosting the excess — one payment for each inbound visit it hosts in excess of the buffer.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">Each of those visits is valued at 21.5% of the hosting studio’s SWPR, up to the agreed monthly maximum. You and your partner agree that maximum between you.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">Set it as high or as low as you like; most studios use their expected share of monthly upgrade fees as the reference point.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; height: 1px; background: #eef0f4; display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 0 40px;\"><span style=\"position: relative; justify-self: start; margin-left: 0; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 999px; background: #fff; border: 1px solid #e1e4ec; display: inline-flex; align-items: center; justify-content: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EB4E8D\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"m19 12-7 7-7-7\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 16px 40px; align-items: center; padding: 30px 0 0;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #EB4E8D;\">Lever 03<\u002Fdiv>\n        <div style=\"font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; color: #1A2B5F;\">Session restrictions<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.55; color: #6b7385;\">\n          <div><span style=\"color: #9aa1b2;\">Applies<\u002Fspan> once the payment cap is exhausted<\u002Fdiv>\n          <div style=\"font-style: italic; color: #9aa1b2;\">Imposed by Moose<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #4c5365;\">Finally, Moose will apply a series of limitations and restrictions on class availability (to one side of the partnership) to bring the crossover back into balance.<\u002Fp>\n\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- PART 3 -->\n  <section style=\"display: flex; flex-direction: column; gap: 20px; padding-top: 16px;\">\n    <div style=\"display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; padding: 20px 28px; background: #1A2B5F; border-radius: 16px;\"><h2 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; color: #fff;\">Fee calculation<\u002Fh2><\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #e1e4ec; border-radius: 24px; padding: 32px 36px; display: flex; flex-direction: column; gap: 24px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; color: #1A2B5F;\">Input your chosen settings<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.6; color: #6b7385;\">For example purposes only. Your actual settings are managed in your studio portal settings.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); grid-auto-rows: auto; gap: 16px; align-items: stretch;\">\n        <div style=\"display: grid; grid-template-rows: subgrid; grid-row: span 3; align-content: start; gap: 22px; padding: 22px 22px 26px; background: #fbf9f6; border: 1px solid #ece7dd; border-radius: 18px; min-width: 0;\">\n          <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #5567a4; padding-bottom: 12px; border-bottom: 1px solid #ece7dd;\">Set by you unilaterally<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; align-self: start; min-width: 0;\">\n            <div style=\"min-height: 38px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;\"><div style=\"font-size: 14px; font-weight: 600; color: #1A2B5F; line-height: 1.35;\">Upgrade fee price<\u002Fdiv><a href=\"/studio-upgrade-fee\" style=\"color: #c5316f; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px;\" style-hover=\"text-decoration: underline;\">Guidance on setting this<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;\"><div style=\"position: relative; width: 140px; flex-shrink: 0;\"><span style=\"position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 600; color: #5567a4;\">$<\u002Fspan><input type=\"text\" sc-camel-input-mode=\"decimal\" placeholder=\"0.00\" value=\"{{ feeText }}\" sc-camel-on-change=\"{{ setFeeText }}\" sc-camel-on-blur=\"{{ commitFee }}\" style=\"width: 100%; box-sizing: border-box; height: 46px; border-radius: 12px; border: 1px solid #c2c9dd; background: #fff; font-size: 16px; font-weight: 600; color: #1A2B5F; padding: 0 44px 0 28px; \"><span style=\"position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 600; color: #5567a4;\">/ {{ unitAbbr }}<\u002Fspan><\u002Fdiv><div style=\"display: inline-flex; flex-direction: column; gap: 2px; padding: 3px; background: #fff; ght: 600; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right;\">{{ netQFmt }}<\u002Fdiv>\n          <div style=\"font-size: 15px; font-weight: 600; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right;\">{{ netAnnualFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin: 12px 20px 0; font-size: 12.5px; line-height: 1.55; color: #6b7385;\"><span style=\"font-weight: 600; color: #1A2B5F; margin-right: 4px;\">Note:<\u002Fspan>Net fees reflect upgrade fees only. They exclude membership fees from any new or retained members gained through the new membership offering.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;workingsOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;defaultCycle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Weekly&quot;,&quot;Monthly&quot;],&quot;default&quot;:&quot;Weekly&quot;,&quot;tsType&quot;:&quot;'Weekly' | 'Monthly'&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    cycle: 'Weekly', members: 200, price: 75, fee: 5,\n    tierUptake: [0.35, 0.13, 0], tierDrive: [0.05, 0.03, 0], tierFeeW: [null, null, 0], tierFeeM: [null, null, 0], customCol: false,\n    myUptake: 0.3, myDrive: 0.04,\n    billingDay: 'Tuesday', swpr: null, nPartners: 1, variance: 0.125, cap: null, upgradesOverride: null,\n    partners: [\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null },\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null },\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null },\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null },\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null },\n      { swpr: 75, inbound: null, outbound: null, variance: null, cap: null }],\n    w: {}, feeText: null, editKey: null, editText: '', numKey: null, numText: '', untouched: { upgrades: false, fee: false, variance: false, cap: false }, feeCycle: null\n  };\n  componentDidMount() {\n    this.setState({ tierUptake: [0.35, 0.13, 0], tierDrive: [0.05, 0.03, 0] });\n    if (this.props.workingsOpen) this.setState({ w: { scen: true, bill: true, comp: true } });\n    if (this.props.defaultCycle && this.props.defaultCycle !== this.state.cycle) this.setState({ cycle: this.props.defaultCycle });\n  }\n  stepTier(key, i, delta, dp) { this.setState(st => { const a = [...st[key]]; const m = Math.pow(10, dp + 2); a[i] = Math.max(0, Math.min(1, Math.round((a[i] + delta) * m) / m)); return { [key]: a, editKey: null }; }); }\n  setPT(i, key, e, scale) { const t = e.target.value, v = parseFloat(t); const inherit = (key === 'variance' || key === 'cap') && t.trim() === ''; this.setState(st => ({ numKey: 'p' + i + key, numText: t, partners: st.partners.map((p, j) => j === i ? { ...p, [key]: inherit ? null : (isNaN(v) ? 0 : Math.max(0, v) * scale) } : p) })); }\n  num(e) { const v = parseFloat(e.target.value); return isNaN(v) ? 0 : v; }\n  setP(i, key, v) { this.setState(s => { const partners = s.partners.map((p, j) => j === i ? { ...p, [key]: v } : p); return { partners }; }); }\n  renderVals() {\n    const s = this.state, P = this.props;\n    const NAVY = '#1A2B5F', RED = '#7c0005';\n    const round = (v, d) => { const m = Math.pow(10, d); return Math.round((v + Number.EPSILON) * m) / m; };\n    const money = v => { if (!isFinite(v)) return '—'; if (Math.abs(v) < 0.005) return '$0.00'; const a = Math.abs(v).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return v < 0 ? `($${a})` : `$${a}`; };\n    const moneyK = v => { if (!isFinite(v)) return '—'; if (Math.abs(v) < 0.5) return '$0'; const a = Math.abs(v).toLocaleString('en-AU', { maximumFractionDigits: 0 }); return v < 0 ? `($${a})` : `$${a}`; };\n    const int = v => { if (!isFinite(v)) return '—'; if (Math.abs(v) < 0.5) return '0'; const a = Math.abs(Math.round(v)).toLocaleString('en-AU'); return v < 0 ? `(${a})` : a; };\n    const dec1 = v => { if (!isFinite(v)) return '—'; if (Math.abs(v) < 0.05) return '0.0'; return v.toLocaleString('en-AU', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); };\n    const pct = v => `${round(v * 100, 1)}%`;\n\n    const weekly = s.cycle === 'Weekly';\n    const unit = weekly ? 'week' : 'month', unitAbbr = weekly ? 'wk' : 'mo';\n    const annual = weekly ? 365.25 / 7 : 12;\n    const tierDefaults = weekly ? [5, 11, 0] : [22, 48, 0];\n    const tierOv = weekly ? s.tierFeeW : s.tierFeeM;\n    const nCols = s.customCol ? 3 : 2;\n    const tierFees = tierDefaults.slice(0, nCols).map((d, i) => tierOv[i] !== null && tierOv[i] !== undefined ? tierOv[i] : d);\n    const tierKey = weekly ? 'tierFeeW' : 'tierFeeM';\n    const fw = s.feeCycle ? s.feeCycle === 'Weekly' : weekly;\n    const annual3 = fw ? 365.25 / 7 : 12;\n    const maxFee = fw ? 11 : 48;\n    const minMoose = fw ? 2.5 : 10.87;\n    const mooseOf = f => round(Math.max(minMoose, f / 3), 2);\n    const minMooseT = weekly ? 2.5 : 10.87;\n    const mooseOfT = f => round(Math.max(minMooseT, f / 3), 2);\n\n    // scenarios\n    const mk = (name, fee, uptake, drive, i) => {\n      const moose = mooseOf(fee), studio = fee - moose;\n      const ups = uptake * s.members, moosePortion = ups * moose, studioPortion = ups * studio;\n      const inc = drive * s.members, incFees = inc * (s.price + studio) * annual, studioAnnual = studioPortion * annual;\n      return { name, fee, uptake, drive, i, moose, studio, ups, moosePortion, studioPortion, mooseAnnual: moosePortion * annual, studioAnnual, inc, incFees, total: incFees + studioAnnual };\n    };\n    const scen = tierFees.map((f, i) => mk(['Lower fee', 'Max. fee', 'Your own'][i], f, s.tierUptake[i], s.tierDrive[i], i));\n    const cols = scen.map(c => ({\n      name: c.name, feeFmt: money(c.fee), isTier: true, nameColor: c.i === 2 ? '#1A2B5F' : '#EB4E8D',\n      feeText: s.editKey === 'f' + c.i ? s.editText : (c.i === 2 && c.fee === 0 ? '' : c.fee.toFixed(2)),\n      feeW: Math.max(60, (s.editKey === 'f' + c.i ? s.editText : (c.i === 2 && c.fee === 0 ? '' : c.fee.toFixed(2))).length * 18.5) + 'px',\n      focusFee: () => this.setState({ editKey: 'f' + c.i, editText: c.fee.toFixed(2) }),\n      upFee: () => { const arr = [...tierOv]; arr[c.i] = Math.min(maxFee, round(c.fee + (weekly ? 0.5 : 1), 2)); this.setState({ [tierKey]: arr, editKey: null }); },\n      downFee: () => { const arr = [...tierOv]; arr[c.i] = Math.max(0, round(c.fee - (weekly ? 0.5 : 1), 2)); this.setState({ [tierKey]: arr, editKey: null }); },\n      setFee: e => { const t = e.target.value; const v = parseFloat(t); const arr = [...tierOv]; arr[c.i] = isNaN(v) ? null : Math.max(0, Math.min(maxFee, v)); this.setState({ editText: t, [tierKey]: arr }); },\n      blurFee: () => this.setState({ editKey: null }), tag: ['Lower fee', 'Max. fee'][c.i],\n      totalFmt: moneyK(c.total),\n      studioAnnualFmt: moneyK(c.studioAnnual), incFeesFmt: moneyK(c.incFees),\n      tipUps: s.tipOpen === 'u' + c.i, tipInc: s.tipOpen === 'i' + c.i, tipUpsN: s.tipOpen === 'un' + c.i, tipIncN: s.tipOpen === 'in' + c.i,\n      showUpsN: () => this.setState({ tipOpen: 'un' + c.i }), showIncN: () => this.setState({ tipOpen: 'in' + c.i }),\n      workingUpsN: `${s.members} members × ${pct(c.uptake)} uptake rate = ${int(c.ups)} member upgrades`,\n      workingIncN: `${s.members} members × ${pct(c.drive)} membership-drive rate = ${dec1(c.inc)} incremental members`,\n      showUps: () => this.setState({ tipOpen: 'u' + c.i }), showInc: () => this.setState({ tipOpen: 'i' + c.i }),\n      workingUps: `${int(c.ups)} member upgrades × ${money(c.studio)} (your share of the ${money(c.fee)} upgr
